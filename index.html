<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>שידור רדיו חי - דף מאזינים</title>
  <!-- ספריית PeerJS לשיחות בלייב -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .player-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
    }
    h1 { margin-bottom: 5px; color: #60a5fa; }
    p.subtitle { color: var(--text-dim); margin-bottom: 20px; font-size: 0.9em; }
    
    .player-container { margin-bottom: 20px; min-height: 80px; }

    .call-section {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
    }
    .call-btn {
      width: 100%;
      padding: 12px;
      background: #3b82f6;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      font-size: 1em;
      cursor: pointer;
    }
    .call-btn.active { background: var(--danger); }

    .msg-section {
      border-top: 1px solid #334155;
      padding-top: 20px;
      text-align: right;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      box-sizing: border-box;
      font-family: inherit;
    }
    button.send-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .status-text { margin-top: 8px; font-size: 0.85em; color: var(--text-dim); }
  </style>
</head>
<body>

  <div class="player-card">
    <h1>📻 תחנת הרדיו שלי</h1>
    <p class="subtitle">מאזינים בלייב לשידור החי</p>

    <!-- הנגן המוטמע -->
    <div class="player-container">
      <div class="cstrEmbed" data-type="newStreamPlayer" data-publicToken="8eddf37e-02c2-4944-b421-1a06b06503b4" data-theme="light" data-color="6C2BDD" data-channelId="" data-rendered="false">
        <a href="https://www.caster.fm">Shoutcast Hosting</a>
      </div>
      <script src="//cdn.cloud.caster.fm//widgets/embed.js"></script>
    </div>

    <!-- עמדת עליה לשידור חי -->
    <div class="call-section">
      <h3 style="margin-top:0;">🎙️ עליה לשידור חי</h3>
      <input type="text" id="callerName" placeholder="השם שלך לשיחה..." style="margin-bottom:10px;">
      <button id="callBtn" class="call-btn" onclick="toggleCall()">📞 בקש לעלות לשידור</button>
      <div id="callStatus" class="status-text">לחץ לבקשת שיחה עם האולפן</div>
    </div>

    <!-- טופס הודעות -->
    <div class="msg-section">
      <h3 style="text-align:center; margin-top:0;">💬 שליחת הודעה לאולפן</h3>
      <input type="text" id="senderName" placeholder="השם שלך...">
      <textarea id="senderMsg" rows="2" placeholder="כתוב הודעה לאולפן..."></textarea>
      <button class="send-btn" onclick="sendMessage()">שלח הודעה 📩</button>
    </div>
  </div>

  <script>
    let peer = null;
    let currentCall = null;
    let localStream = null;

    // מזהה קבוע לאולפן
    const STUDIO_PEER_ID = 'radio_studio_live_room_123';

    function toggleCall() {
      const name = document.getElementById('callerName').value.trim();
      const callBtn = document.getElementById('callBtn');
      const status = document.getElementById('callStatus');

      if (!currentCall) {
        if (!name) return alert("אנא רשום את שמך לפני ההתקשרות");

        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
          localStream = stream;
          peer = new Peer();

          peer.on('open', (id) => {
            status.innerText = "מתחבר לאולפן...";
            
            // שליחת אות בקשה לאולפן
            let requests = JSON.parse(localStorage.getItem('call_requests') || '[]');
            requests.unshift({ id: id, name: name, time: new Date().toLocaleTimeString() });
            localStorage.setItem('call_requests', JSON.stringify(requests));

            // ביצוע השיחה
            const call = peer.call(STUDIO_PEER_ID, stream);
            currentCall = call;

            call.on('stream', remoteStream => {
              status.innerText = "🟢 אתה מחובר בלייב לאולפן!";
              callBtn.innerText = "🔴 נתק שיחה";
              callBtn.classList.add('active');
            });

            call.on('close', () => { endCallUI(); });
          });

        }).catch(err => {
          alert("נדרשת הרשאה למיקרופון כדי לעלות לשידור");
        });
      } else {
        if (currentCall) currentCall.close();
        endCallUI();
      }
    }

    function endCallUI() {
      const callBtn = document.getElementById('callBtn');
      const status = document.getElementById('callStatus');
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      currentCall = null;
      callBtn.innerText = "📞 בקש לעלות לשידור";
      callBtn.classList.remove('active');
      status.innerText = "השיחה הסתיימה";
    }

    function sendMessage() {
      const name = document.getElementById('senderName').value.trim();
      const msg = document.getElementById('senderMsg').value.trim();
      if (!name || !msg) return alert("למלא שם והודעה");

      let messages = JSON.parse(localStorage.getItem('radio_messages') || '[]');
      messages.unshift({ name, text: msg, time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) });
      localStorage.setItem('radio_messages', JSON.stringify(messages));
      
      document.getElementById('senderName').value = '';
      document.getElementById('senderMsg').value = '';
      alert("ההודעה נשלחה!");
    }
  </script>
</body>
</html>
