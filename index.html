<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>רדיו בלייב - עלה לשידור</title>
  <!-- טעינת ספריית PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid #334155;
    }
    h1 { color: #60a5fa; margin-top: 0; }
    p { color: #94a3b8; line-height: 1.5; }
    .call-btn {
      background: #22c55e;
      color: white;
      border: none;
      padding: 16px 28px;
      font-size: 1.1em;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
    }
    .call-btn:hover { background: #16a34a; transform: translateY(-2px); }
    .call-btn:disabled { background: #475569; cursor: not-allowed; transform: none; box-shadow: none; }
    .hangup-btn {
      background: #ef4444;
      display: none;
      margin-top: 10px;
    }
    .hangup-btn:hover { background: #dc2626; }
    #status {
      margin-top: 20px;
      font-weight: bold;
      font-size: 0.95em;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>📻 עלייה לשידור חי</h1>
    <p>רוצה לדבר בשידור? לחץ על הכפתור למטה, אשר את המיקרופון ותתחבר מיד לאולפן!</p>

    <button id="callBtn" class="call-btn" onclick="startLiveCall()">
      📞 לחץ כאן כדי לדבר בשידור
    </button>

    <button id="hangupBtn" class="call-btn hangup-btn" onclick="endCall()">
      🔴 נתק שיחה
    </button>

    <div id="status"></div>
  </div>

  <script>
    const STUDIO_PEER_ID = 'radio-shimon-live-studio';
    let currentCall = null;
    let localStream = null;

    async function startLiveCall() {
      const statusDiv = document.getElementById('status');
      const callBtn = document.getElementById('callBtn');
      const hangupBtn = document.getElementById('hangupBtn');

      statusDiv.innerHTML = '<span style="color: #eab308;">מבקש גישה למיקרופון...</span>';

      try {
        // 1. בקשת הרשאה למיקרופון
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });

        statusDiv.innerHTML = '<span style="color: #eab308;">מחייג לאולפן...</span>';
        callBtn.disabled = true;

        // 2. יצירת חיבור Peer למאזין
        const listenerPeer = new Peer();

        listenerPeer.on('open', () => {
          // 3. חיוג לאולפן
          const call = listenerPeer.call(STUDIO_PEER_ID, localStream);
          currentCall = call;

          statusDiv.innerHTML = '<span style="color: #22c55e;">🟢 אתה מחובר בלייב לאולפן! אתה בשידור.</span>';
          hangupBtn.style.display = 'block';

          call.on('close', () => {
            resetCallUI('השיחה הסתיימה.');
          });
        });

        listenerPeer.on('error', (err) => {
          console.error(err);
          resetCallUI('❌ האולפן אינו זמין כעת.');
        });

      } catch (err) {
        console.error(err);
        statusDiv.innerHTML = '<span style="color: #ef4444;">❌ יש לאשר גישה למיקרופון בדפדפן כדי לעלות לשידור.</span>';
        callBtn.disabled = false;
      }
    }

    function endCall() {
      if (currentCall) {
        currentCall.close();
      }
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }
      resetCallUI('ניתקת את השיחה.');
    }

    function resetCallUI(message) {
      document.getElementById('status').innerHTML = `<span style="color: #94a3b8;">${message}</span>`;
      document.getElementById('callBtn').disabled = false;
      document.getElementById('hangupBtn').style.display = 'none';
      currentCall = null;
    }
  </script>

</body>
</html>
